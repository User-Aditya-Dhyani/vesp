<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VESP Mesh Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <h1>VESP — Mesh Provisioner</h1>

    <section class="controls">
      <div class="row">
        <button id="btnCreateNet">Create Network</button>
        <button id="btnAttach">Attach</button>
        <button id="btnLeave">Leave</button>
        <button id="btnPurge">Purge Local Node</button>
      </div>
      <div class="row">
        <button id="btnScanStart">Scan (15s)</button>
        <button id="btnScanStop">Stop Scan</button>
        <span id="scanStatus">idle</span>
      </div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Scan Results (Unprovisioned)</h2>
        <div class="row">
          <button id="btnRefreshSeen">Refresh</button>
          <button id="btnProvision" disabled>Provision Selected</button>
        </div>
        <table id="seenTable">
          <thead>
            <tr><th>UUID</th><th>RSSI</th><th>Last Seen</th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="hint">Click a row to select. Double-click to provision immediately.</div>
      </section>

      <section class="panel">
        <h2>Logs</h2>
        <div class="row">
          <button id="btnListRecent">List Recent</button>
          <label><input type="checkbox" id="chkAutoPoll"> Auto-poll</label>
          <select id="pollRate">
            <option value="250">0.25s</option>
            <option value="500">0.5s</option>
            <option value="1000" selected>1s</option>
            <option value="2000">2s</option>
            <option value="5000">5s</option>
          </select>
          <label><input type="checkbox" id="chkFreeze"> Freeze scroll</label>
        </div>
        <pre id="logBox" class="log"></pre>
      </section>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
